name: Bug Report
description: Report a bug in TorchBowMod
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        ⚠ IMPORTANT  
        This repository is **only for the Forge version of TorchBowMod**.

        If you are using another mod loader, please report the issue in the correct repository:

        NeoForge → https://github.com/noriokun4649/TorchBowMod-NeoForge
        Fabric   → https://github.com/noriokun4649/TorchBowMod-fabric
        Quilt    → https://github.com/noriokun4649/TorchBowMod-quilt

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      description: Which mod loader are you using?
      options:
        - Forge
        - Fabric
        - Quilt
        - Other
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      placeholder: e.g. 1.21.1
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: TorchBowMod Version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Hold a bow
        2. Use a torch as ammo
        3. Shoot
        4. The issue occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      description: Please paste crash reports or logs if available.
      render: shell