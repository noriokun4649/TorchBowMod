name: Feature Request
description: Suggest a new feature
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ⚠ IMPORTANT  
        This repository is **only for the Forge version of TorchBowMod**.

        If your request is for another mod loader, please use the correct repository:

        NeoForge → https://github.com/noriokun4649/TorchBowMod-NeoForge
        Fabric   → https://github.com/noriokun4649/TorchBowMod-fabric
        Quilt    → https://github.com/noriokun4649/TorchBowMod-quilt

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      description: Which mod loader are you using?
      options:
        - Forge
        - NeoForge
        - Fabric
        - Quilt
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      placeholder: e.g. 1.21.1
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: TorchBowMod Version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see.
      placeholder: Explain the idea clearly.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why is this feature useful?
      description: Explain why this feature would improve the mod.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots.